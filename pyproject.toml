[project]
name = "ai-maneger"
version = "0.1.0"
description = "AI agent management platform"
readme = "README.md"
authors = [
    { name = "Deepak Verma", email = "deepakverma7905640118@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "boto3>=1.35",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "strands-agents[openai]>=1.63.0",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
ai-maneger = "ai_maneger.main:run"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
